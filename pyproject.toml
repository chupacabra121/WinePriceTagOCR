[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wine-price-tag-ocr"
version = "0.1.0"
description = "Read wine names and prices off retail shelf photos and build a comparison table."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.121",
    "pydantic>=2.7",
    "pillow>=10.3",
    "pillow-heif>=0.16",
    "openpyxl>=3.1",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wine-ocr = "wine_ocr.cli:app"

[tool.setuptools.packages.find]
include = ["wine_ocr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
